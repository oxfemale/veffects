name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev

      - name: Install SDL dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install sdl2 sdl2_mixer

      - name: Install SDL dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install sdl2 sdl2-mixer -y

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release
